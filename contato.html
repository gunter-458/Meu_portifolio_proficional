    <h1 class="mb-3">Contato</h1>
<p>Use o formulário abaixo como exemplo de formulário HTML. Ele não envia os dados para um servidor.</p>
<form id="formContato" class="row g-3">
 <div class="col-md-6"><label for="nome" class="form-label">Nome</label><input type="text" class="form-control" id="nome" required></div>
 <div class="col-md-6"><label for="email" class="form-label">E-mail</label><input type="email" class="form-control" id="email" required></div>
 <div class="col-12"><label for="assunto" class="form-label">Assunto</label><select id="assunto" class="form-select"><option>Dúvida</option><option>Sugestão</option><option>Outro</option></select></div>
 <div class="col-12"><label for="mensagem" class="form-label">Mensagem</label><textarea id="mensagem" class="form-control" rows="4" required></textarea></div>
 <div class="col-12"><button class="btn btn-primary" type="submit">Enviar</button></div>
</form><p id="aviso" class="mt-3" role="status"></p>
  </main>
